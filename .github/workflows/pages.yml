name: Мини-апп

# Собирает данные лиги и публикует webapp/ на GitHub Pages (ADR-003).
# Один раз включить: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # раз в час; GitHub может запускать с опозданием
    - cron: "5 21 * * *"   # 00:05 МСК: расклад нового дня «Раската» (ADR-018) — сразу после полуночи
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Поставить зависимости
        run: pip install --disable-pip-version-check -q -r requirements.txt

      # Протоколы копятся между запусками, чтобы не качать весь сезон каждый час
      - uses: actions/cache@v4
        with:
          path: results.json
          key: results-${{ github.run_id }}
          restore-keys: results-

      # Пока сайт РХЛ закрыт, шаг выключен. Включить: Settings → Variables → LEAGUE_SITE=https://rhl.fhr.ru
      - name: Скачать протоколы матчей
        if: vars.LEAGUE_SITE != ''
        continue-on-error: true
        run: python league.py --site "${{ vars.LEAGUE_SITE }}"

      # Лидеры лиги (ADR-009). Пока у нового сезона нет статистики, остаётся прошлый из leaders.json в git
      - name: Скачать лидеров лиги
        if: vars.LEAGUE_SITE != ''
        continue-on-error: true
        run: python league.py --leaders --site "${{ vars.LEAGUE_SITE }}"

      # Посты каналов клубов для листа «Главной» (ADR-015): превью с t.me/s, по одному запросу в секунду.
      # Упадёт или половина каналов не откроется — лист соберётся из своих данных, шаг станет красным
      - name: Посты каналов клубов
        continue-on-error: true
        run: python tg_channels.py

      # Время матчей и ссылки на онлайн с сервера матч-центра (ADR-019, раздел 5): Settings → Variables →
      # LIVE_API=https://…/api. Сервер не ответил или ответил не JSON — сборка идёт без schedule.json,
      # время берётся из протоколов и постов клубов
      - name: Скачать время матчей
        if: vars.LIVE_API != ''
        continue-on-error: true
        env:
          LIVE_API: ${{ vars.LIVE_API }}
        run: |
          [[ "$LIVE_API" =~ ^https://[A-Za-z0-9./_:-]+$ ]] || { echo "LIVE_API — только https://адрес без пробелов и кавычек"; exit 1; }
          curl -sS --fail --max-time 20 -o schedule.tmp "${LIVE_API%/}/live/schedule.json"
          python -c "import json; d = json.load(open('schedule.tmp', encoding='utf-8')); assert isinstance(d.get('games'), list)"
          mv schedule.tmp schedule.json
          python -c "import json; print('Матчей со временем:', len(json.load(open('schedule.json', encoding='utf-8'))['games']))"

      # Ссылки на бота и мини-апп (ADR-004) заданы в build_data.py; Variables BOT_LINK, APP_LINK их заменяют
      - name: Собрать данные
        env:
          BOT_LINK: ${{ vars.BOT_LINK }}
          APP_LINK: ${{ vars.APP_LINK }}
        run: python build_data.py

      # «Раскат» (ADR-018): расклады дней в webapp/data/raskat/. Упадёт — мини-апп всё равно
      # публикуется, но без расклада дня: игра покажет карточку ожидания
      - name: Собрать раскаты дня
        continue-on-error: true
        env:
          # Settings → Secrets → RASKAT_SALT. Без секрета берётся соль из raskat/rules.py,
          # и расклад завтрашнего дня можно посчитать заранее своим запуском движка (ADR-018)
          RASKAT_SALT: ${{ secrets.RASKAT_SALT }}
        run: python build_raskat.py

      # Pages отдаёт файлы с кэшем на 10 минут, а Telegram держит их ещё дольше. Метка версии в адресе
      # заставляет взять свежие app.js и style.css вместе с новым index.html, иначе они расходятся
      # Тот же шаг подставляет базу API «Раската» (ADR-018): Settings → Variables → RASKAT_API=https://…/api/raskat.
      # Пусто — игра работает без зачёта: поле, время и личные записи на устройстве.
      # И базу матч-центра (ADR-019, ADR-020): LIVE_API=https://…/api. Пусто — без живого счёта и прогнозов
      - name: Метка версии для кэша
        env:
          RASKAT_API: ${{ vars.RASKAT_API }}
          LIVE_API: ${{ vars.LIVE_API }}
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$v\"#; s#src=\"app.js\"#src=\"app.js?v=$v\"#" webapp/index.html
          sed -i "s#href=\"raskat.css\"#href=\"raskat.css?v=$v\"#; s#src=\"raskat.js\"#src=\"raskat.js?v=$v\"#" webapp/index.html
          grep -q "app.js?v=$v" webapp/index.html && grep -q "style.css?v=$v" webapp/index.html
          grep -q "raskat.js?v=$v" webapp/index.html && grep -q "raskat.css?v=$v" webapp/index.html
          if [ -n "$RASKAT_API" ]; then
            [[ "$RASKAT_API" =~ ^https://[A-Za-z0-9./_:-]+$ ]] || { echo "RASKAT_API — только https://адрес без пробелов и кавычек"; exit 1; }
            sed -i "s#window.RASKAT_API = \"\";#window.RASKAT_API = \"$RASKAT_API\";#" webapp/index.html
            grep -q "window.RASKAT_API = \"https://" webapp/index.html
          fi
          if [ -n "$LIVE_API" ]; then
            [[ "$LIVE_API" =~ ^https://[A-Za-z0-9./_:-]+$ ]] || { echo "LIVE_API — только https://адрес без пробелов и кавычек"; exit 1; }
            sed -i "s#window.LIVE_API = \"\";#window.LIVE_API = \"${LIVE_API%/}\";#" webapp/index.html
            grep -q "window.LIVE_API = \"https://" webapp/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
