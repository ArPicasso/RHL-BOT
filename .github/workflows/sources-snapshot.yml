name: Снимок источников

# Разработка не видит сайты лиги из своей песочницы (ADR-019, раздел 6): задание качает публичные
# страницы rhl.fhr.ru, r-hockey и онлайна КХЛ с раннера GitHub и кладёт их в ветку snapshots/sources — из них
# делаются фикстуры tests/. Запускается руками или правкой этого файла. По одному запросу, пауза
# секунда (CLAUDE.md). Онлайн КХЛ для зарубежных IP, скорее всего, закрыт — тогда в сводке 403.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sources-snapshot.yml"

permissions:
  contents: write   # снимок кладётся в отдельную ветку snapshots/sources, не в main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать страницы
        shell: python
        env:
          # API сервера (ADR-019): что служба live разобрала из онлайна КХЛ — тот же адрес, что берёт Pages
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          import re, time, urllib.request, urllib.error
          from pathlib import Path
          from urllib.parse import urljoin
          out = Path("snapshot"); out.mkdir()
          ua = "ryazan-vdv-schedule-bot (+https://github.com/ArPicasso/bogdanov)"
          seen = {}
          def get(url, name):
              if url in seen or len(seen) >= 70:
                  return None
              seen[url] = name
              time.sleep(1)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=30) as r:
                      raw = r.read()
                      enc = r.headers.get_content_charset() or "utf-8"
                      code = r.status
              except urllib.error.HTTPError as e:
                  raw, enc, code = e.read(), "utf-8", e.code
              except Exception as e:
                  print(f"{name:28} ОШИБКА {type(e).__name__}: {e} — {url}")
                  return None
              text = raw.decode(enc, errors="replace")
              (out / f"{name}.html").write_text(text, encoding="utf-8")
              title = re.search(r"<title>(.*?)</title>", text, re.S | re.I)
              print(f"{name:28} {code} {len(raw):>8} {title.group(1).strip()[:70] if title else '—'} — {url}")
              return text
          home = get("https://rhl.fhr.ru/", "rhl_home") or ""
          links = []
          for href in re.findall(r'href="([^"#]+)"', home):
              u = urljoin("https://rhl.fhr.ru/", href)
              if "rhl.fhr.ru" in u and re.search(r"calendar|report|idgame|stat|tournament|match|game|table", u, re.I):
                  links.append(u)
          for i, u in enumerate(dict.fromkeys(links)):
              if i >= 12:
                  break
              page = get(u, f"rhl_link{i:02d}")
              if page and i < 4:
                  for href in re.findall(r'href="([^"#]*(?:idgame|report)[^"#]*)"', page)[:3]:
                      get(urljoin(u, href), f"rhl_link{i:02d}_report{len(seen):02d}")
          # Матч-центр: по каждому матчу из главной и календаря — страница матча и её «онлайн»
          cal = (out / "rhl_link00.html").read_text(encoding="utf-8") if (out / "rhl_link00.html").exists() else ""
          games = list(dict.fromkeys(re.findall(r"/matchcenter/(\d+)/(\d+)/", home + cal)))
          print("матчей в матч-центре:", len(games), games[:12])
          for t, g in games[:8]:
              get(f"https://rhl.fhr.ru/matchcenter/{t}/{g}/", f"rhl_mc_{g}")
              get(f"https://rhl.fhr.ru/matchcenter/{t}/{g}/live/", f"rhl_mc_{g}_live")
          # Вкладки сыгранных матчей: протокол, видео; страница трансляций; скрипты матч-центра; лидеры
          for t, g in games[:4]:
              get(f"https://rhl.fhr.ru/matchcenter/{t}/{g}/protocol/", f"rhl_mc_{g}_protocol")
              get(f"https://rhl.fhr.ru/matchcenter/{t}/{g}/video/", f"rhl_mc_{g}_video")
          get("https://rhl.fhr.ru/translations/", "rhl_translations")
          get("https://rhl.fhr.ru/stat/leaders/season/2026-2027/tournament/1432/nomination/scorers/", "rhl_leaders_scorers")
          mc = (out / f"rhl_mc_{games[0][1]}.html").read_text(encoding="utf-8") if games and (out / f"rhl_mc_{games[0][1]}.html").exists() else ""
          for i, src in enumerate(dict.fromkeys(re.findall(r'<script[^>]+src="(/local/[^"]+\.js[^"]*)"', mc + home))):
              get(urljoin("https://rhl.fhr.ru/", src), f"rhl_js_{i}_" + re.sub(r"[^A-Za-z0-9]+", "_", src.split("/")[-1].split("?")[0]))
          # Каналы клубов в день матча: посты о ходе игры (t.me/s — превью без входа)
          for ch in ("nmhlpervenstvo", "hcryazan_official", "rostovhc", "HCGvardiaKrd", "mhkbelgorod31"):
              get(f"https://t.me/s/{ch}", f"tg_{ch}")
          get("https://r-hockey.ru/stat/temp/2027/30904/calendar?month=10", "rhockey_rhl_2026_10")
          get("https://online.khl.ru/online/", "khl_online_day")
          # Что опубликовано в мини-аппе: адреса API в index.html и данные league.json
          get("https://arpicasso.github.io/bogdanov/", "pages_index")
          get("https://arpicasso.github.io/bogdanov/data/league.json", "pages_league")
          import os
          host = os.environ.get("HOST", "")
          if re.fullmatch(r"\d{1,3}(\.\d{1,3}){3}", host):
              api = f"https://{host.replace('.', '-')}.sslip.io/api"
              for name in ("health", "live/today.json", "live/sources.json", "live/schedule.json"):
                  get(f"{api}/{name}", "api_" + name.replace("/", "_").replace(".json", ""))

      # Ветка snapshots/sources — только снимки, без истории кода: git fetch и смотреть
      - name: Положить в ветку snapshots/sources
        run: |
          cd snapshot
          git init -q -b snapshots/sources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Снимок источников $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshots/sources
