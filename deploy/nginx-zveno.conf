# nginx для API «Звена»: HTTPS на api.<домен>, /api/zveno/ → сервер на 127.0.0.1:8090.
# Установка — deploy/README.md, шаг 8. Замени api.example.ru на свой адрес во всём файле:
#   sudo sed -i 's/api.example.ru/api.ВАШ-ДОМЕН.ru/g' /etc/nginx/sites-available/zveno
# Сертификат выпускает certbot (--webroot) до включения этого файла; продлевает сам.

# не больше 10 запросов в секунду с одного адреса, всплеск до 40 (файл подключается внутри http {})
limit_req_zone $binary_remote_addr zone=zveno:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.ru;

    # проверка certbot при выпуске и продлении сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 из Ubuntu 24.04: http2 — в строке listen
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.ru;

    ssl_certificate     /etc/letsencrypt/live/api.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:zveno:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 64k;
    # заголовок Authorization (initData) в журнал не пишем: формат по умолчанию его и не пишет
    access_log /var/log/nginx/zveno.access.log;
    error_log  /var/log/nginx/zveno.error.log;

    location /api/zveno/ {
        limit_req zone=zveno burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
