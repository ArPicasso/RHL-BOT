<title>Карта лиги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=Unbounded:wght@700;800&display=swap">
<style>
  /* Экран-игра: карта во весь экран, тонкая шапка сверху, заряд снизу, мини-карта в углу */
  :root {
    --ice: #eef4fb;        /* лёд: фон поля */
    --land: #ffffff;       /* ничья клетка */
    --edge: #0b1220;       /* контур */
    --ink: #0b1220;
    --muted: #5a6577;
    --paper: #ffffff;
    --bg: #dde6f2;
    --sun: #ffd731;
    --ember: #fb4903;
    --mint: #55db9c;
    --grid: rgba(11, 18, 32, .18);
    --shadow: 0 8px 24px rgba(11, 18, 32, .14);
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --text: "Onest", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ice: #0f1824; --land: #1b2534; --edge: #000000; --ink: #e6ecf5; --muted: #93a0b4;
      --paper: #17202c; --bg: #0a111b; --grid: rgba(230, 236, 245, .14);
      --shadow: 0 8px 24px rgba(0, 0, 0, .5); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ice: #0f1824; --land: #1b2534; --edge: #000000; --ink: #e6ecf5; --muted: #93a0b4;
    --paper: #17202c; --bg: #0a111b; --grid: rgba(230, 236, 245, .14);
    --shadow: 0 8px 24px rgba(0, 0, 0, .5); color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--text); overflow: hidden; }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }

  /* ---------- шапка ---------- */
  header { padding: 8px 12px calc(8px) 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
    display: grid; gap: 6px; background: var(--paper); border-bottom: 1px solid var(--grid); z-index: 5; }
  .row { display: flex; align-items: center; gap: 8px; }
  .crest { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 1.5px solid var(--edge);
    display: grid; place-items: center; overflow: hidden; flex: none; }
  .crest img { width: 86%; height: 86%; object-fit: contain; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; border: 1px solid var(--edge); }
  .who { font: 800 14px/1.1 var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who small { display: block; font: 500 11px/1.2 var(--text); color: var(--muted); }
  .tourbox { text-align: right; font: 800 12px/1.1 var(--text); }
  .tourbox b { display: block; font: 800 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  .tourbox span { font: 500 11px/1 var(--text); color: var(--muted); }
  .ticker { font: 500 12px/1.3 var(--text); color: var(--ink); background: var(--ice); border-radius: 10px;
    padding: 6px 10px; display: flex; gap: 6px; align-items: center; min-height: 30px; }
  .ticker b { font-weight: 800; }
  .ticker .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ember); flex: none; }

  /* ---------- карта ---------- */
  #stage { position: relative; overflow: hidden; background: var(--ice); touch-action: none; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .c { stroke: var(--grid); stroke-width: 1; fill: var(--land); cursor: pointer; transition: fill .18s ease; }
  .c.own { stroke: rgba(255,255,255,.35); }
  .c.hit { animation: pop .42s ease; }
  @keyframes pop { 0% { transform: scale(.55); transform-origin: center; } 60% { transform: scale(1.12); } 100% { transform: none; } }
  .ring { fill: none; stroke: var(--edge); stroke-width: 2.5; pointer-events: none; }
  .can { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-dasharray: 5 4; pointer-events: none;
    animation: blink 1.4s linear infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .cost { font: 800 11px/1 var(--display); fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 3px;
    pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  .mine-dot { fill: #fff; opacity: .9; pointer-events: none; }
  .city { pointer-events: none; }
  .city circle { fill: #fff; stroke: var(--edge); stroke-width: 2; }
  .landing { fill: none; stroke: var(--ember); stroke-width: 3; animation: blink 1s linear infinite; pointer-events: none; }

  /* ---------- мини-карта ---------- */
  #mini { position: absolute; right: 10px; top: 10px; width: 118px; height: 74px; background: var(--paper);
    border: 1.5px solid var(--edge); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); }
  #mini svg { width: 100%; height: 100%; display: block; }
  #mini .vp { fill: none; stroke: var(--ember); stroke-width: 6; }
  .zoom { position: absolute; right: 10px; bottom: 90px; display: grid; gap: 6px; }
  .zoom button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--paper);
    color: var(--ink); font: 800 18px/1 var(--display); cursor: pointer; box-shadow: var(--shadow); }

  /* ---------- низ: заряд ---------- */
  footer { background: var(--paper); border-top: 1px solid var(--grid); padding: 8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; z-index: 5; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .res { display: flex; align-items: baseline; gap: 7px; flex: 1; min-width: 0; }
  .res b { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
  .res span { font: 500 12px/1.2 var(--text); color: var(--muted); }
  .res i { display: block; font-style: normal; font-weight: 700; color: var(--ink); }
  .tgt { flex: 1; min-width: 0; font: 700 13px/1.25 var(--text); }
  .push { display: flex; align-items: center; gap: 6px; flex: none; }
  .push button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--edge); background: var(--paper);
    color: var(--ink); font: 800 16px/1 var(--display); cursor: pointer; }
  .push button:disabled { opacity: .3; }
  .push b { font: 800 18px/1 var(--display); min-width: 16px; text-align: center; }
  td.why { font: 500 12px/1.3 var(--text); color: var(--muted); padding-top: 0; }
  .tgt small { display: block; font: 500 12px/1.2 var(--text); color: var(--muted); }
  .ord { stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; }
  .ord-head { fill: var(--ink); }
  .ord-n { font: 800 11px/1 var(--display); fill: var(--paper); }
  .ord-bg { fill: var(--ink); }
  .sel { fill: none; stroke: var(--ink); stroke-width: 4; }
  .charge { display: flex; align-items: center; gap: 10px; }
  .pucks { display: flex; gap: 3px; flex: 1; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
  .pk { width: 14px; height: 10px; border-radius: 4px; background: var(--ink); flex: none; }
  .pk.off { background: none; border: 1.5px solid var(--grid); }
  .charge b { font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; }
  .hint { font: 500 12px/1.3 var(--text); color: var(--muted); min-height: 16px; }
  .hint b { color: var(--ink); font-weight: 800; }
  .btn { font: 800 13px/1 var(--text); background: var(--ink); color: var(--paper); border: 0; border-radius: 999px;
    padding: 11px 18px; cursor: pointer; }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1.5px solid var(--edge); }
  .mini-btn { font: 700 11px/1 var(--text); background: var(--ice); color: var(--ink); border: 1px solid var(--grid);
    border-radius: 999px; padding: 7px 10px; cursor: pointer; }

  /* ---------- оверлеи ---------- */
  .veil { position: fixed; inset: 0; background: rgba(8, 14, 24, .55); display: grid; place-items: center;
    padding: 16px; z-index: 20; }
  .card { background: var(--paper); border: 2px solid var(--edge); border-radius: 22px; box-shadow: var(--shadow);
    padding: 18px; max-width: 420px; width: 100%; max-height: 86vh; overflow: auto; }
  .card h1 { font: 800 22px/1.1 var(--display); margin: 0 0 6px; text-wrap: balance; }
  .card h2 { font: 800 15px/1.2 var(--text); margin: 14px 0 4px; }
  .card p { font: 500 14px/1.45 var(--text); margin: 0 0 10px; color: var(--ink); }
  .card p.muted { color: var(--muted); font-size: 13px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin-top: 10px; }
  .tm { display: grid; justify-items: center; gap: 4px; background: var(--ice); border: 1.5px solid transparent;
    border-radius: 14px; padding: 8px 4px; cursor: pointer; }
  .tm.on { border-color: var(--edge); }
  .tm img { width: 34px; height: 34px; object-fit: contain; }
  .tm span { font: 700 9px/1.1 var(--text); text-align: center; }
  .steps { display: flex; gap: 5px; margin-bottom: 10px; }
  .steps i { height: 4px; flex: 1; background: var(--grid); border-radius: 2px; }
  .steps i.on { background: var(--ink); }
  table { width: 100%; border-collapse: collapse; font: 600 13px/1.2 var(--text); }
  td { padding: 6px 4px; border-bottom: 1px solid var(--grid); }
  td.n { font-variant-numeric: tabular-nums; text-align: right; font-weight: 800; }
  td.em { width: 26px; }
  td.em img { width: 22px; height: 22px; object-fit: contain; display: block; }
  tr.me td { background: var(--ice); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 112px; background: var(--ink); color: var(--paper);
    font: 700 13px/1.3 var(--text); padding: 10px 14px; border-radius: 999px; z-index: 15; box-shadow: var(--shadow);
    opacity: 0; transition: opacity .2s ease, transform .2s ease; max-width: 88vw; text-align: center; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  .coach { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--paper); border: 2px solid var(--edge);
    border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); z-index: 12; }
  .coach p { margin: 0; font: 600 14px/1.4 var(--text); }
  .coach .acts { margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) {
    .c, .toast { transition: none; }
    .c.hit, .can, .landing { animation: none; }
  }
</style>

<div id="app">
  <header>
    <div class="row">
      <span class="crest" id="my-crest"></span>
      <span class="who" id="my-name">Выбери клуб<small>и начинай с его города</small></span>
      <span class="tourbox"><b id="weekn">1</b><span>неделя</span></span>
    </div>
    <div class="ticker"><i class="dot"></i><span id="ticker">Вся Россия — поле. Каждый клуб начинает с одной клетки — своего города.</span></div>
  </header>

  <div id="stage">
    <svg id="map" aria-label="Карта лиги"></svg>
    <div id="mini"><svg id="minisvg" aria-hidden="true"></svg></div>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Приблизить">+</button>
      <button type="button" id="zout" aria-label="Отдалить">−</button>
    </div>
    <div class="coach" id="coach" hidden><p id="coach-t"></p><div class="acts"><button class="btn" id="coach-b">Дальше</button></div></div>
  </div>

  <footer>
    <div class="bar" id="bar-plan">
      <div class="res"><b id="res-n">0</b><span>резерв<i id="res-in"></i></span></div>
      <button class="btn" id="go">Игровой вечер</button>
      <button class="mini-btn" id="why">Правила</button>
    </div>
    <div class="bar" id="bar-target" hidden>
      <div class="tgt" id="tgt-info"></div>
      <div class="push"><button type="button" id="push-less" aria-label="Меньше">−</button><b id="push-n">1</b><button type="button" id="push-more" aria-label="Больше">+</button></div>
      <button class="btn" id="send">Направить</button>
      <button class="mini-btn" id="cancel">Отмена</button>
    </div>
    <div class="hint" id="hint">Выбери клуб — и поехали.</div>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>
<div class="veil" id="veil" hidden><div class="card" id="card"></div></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const CELLS = D.cells, ADJ = D.adj, CLUBS = D.clubs, N = CELLS.length;
  const S = D.s;
  const owner = new Int16Array(N).fill(-1);
  const mineCell = new Uint8Array(N);              // клетки, взятые по твоим приказам
  const byClub = CLUBS.map(() => 0);
  const baseOf = new Int16Array(N).fill(-1);
  const level = CLUBS.map(() => 0);                // развитие города: оборона и доход
  CLUBS.forEach((c, i) => { baseOf[c.base] = i; });

  const ST = {
    me: -1, res: 0, push: 1, report: [], week: 1, phase: "plan", orders: new Map(), sel: -1,
    taken: 0, landing: new Set(), over: false, step: 0, lastScore: "",
  };
  const WEEKS = 3;
  const $ = (s) => document.querySelector(s);
  const plural = (n, a, b, c) => {
    const t = n % 100, o = n % 10;
    return t > 10 && t < 20 ? c : o === 1 ? a : o >= 2 && o <= 4 ? b : c;
  };

  // ---------- поле ----------
  const NS = "http://www.w3.org/2000/svg";
  const hexPath = (x, y) => {
    let d = "";
    for (let k = 0; k < 6; k++) {
      const a = Math.PI / 180 * (60 * k - 30);
      d += (k ? "L" : "M") + (x + S * Math.cos(a)).toFixed(1) + " " + (y + S * Math.sin(a)).toFixed(1);
    }
    return d + "Z";
  };
  const map = $("#map");
  const gCells = document.createElementNS(NS, "g");
  const gMarks = document.createElementNS(NS, "g");
  const gCity = document.createElementNS(NS, "g");
  const gCan = document.createElementNS(NS, "g");
  const gOrd = document.createElementNS(NS, "g");
  map.append(gCells, gMarks, gCity, gCan, gOrd);
  const nodes = [], marks = [], cityNodes = [];
  for (let i = 0; i < N; i++) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", hexPath(CELLS[i].x, CELLS[i].y));
    p.setAttribute("class", "c");
    p.dataset.i = i;
    gCells.appendChild(p);
    nodes.push(p);
    const m = document.createElementNS(NS, "circle");
    m.setAttribute("cx", CELLS[i].x); m.setAttribute("cy", CELLS[i].y); m.setAttribute("r", 0);
    m.setAttribute("class", "mine-dot");
    gMarks.appendChild(m);
    marks.push(m);
  }
  CLUBS.forEach((c) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "city");
    const cell = CELLS[c.base];
    const circ = document.createElementNS(NS, "circle");
    circ.setAttribute("cx", cell.x); circ.setAttribute("cy", cell.y); circ.setAttribute("r", S * .62);
    const img = document.createElementNS(NS, "image");
    img.setAttribute("href", c.logo); img.setAttribute("x", cell.x - S * .5); img.setAttribute("y", cell.y - S * .5);
    img.setAttribute("width", S); img.setAttribute("height", S);
    img.setAttribute("preserveAspectRatio", "xMidYMid meet");
    g.append(circ, img);
    gCity.appendChild(g);
    cityNodes.push(circ);
  });

  const mini = $("#minisvg");
  mini.setAttribute("viewBox", `0 0 ${D.w} ${D.h}`);
  const miniNodes = [];
  for (let i = 0; i < N; i++) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", hexPath(CELLS[i].x, CELLS[i].y));
    p.setAttribute("fill", "var(--land)");
    p.setAttribute("stroke", "none");
    mini.appendChild(p);
    miniNodes.push(p);
  }
  const vp = document.createElementNS(NS, "rect");
  vp.setAttribute("class", "vp");
  mini.appendChild(vp);

  // ---------- камера ----------
  const cam = { x: D.w / 2, y: D.h / 2, z: 1 };
  const stage = () => $("#stage").getBoundingClientRect();
  const zAll = () => { const r = stage(); return Math.min(r.width / D.w, r.height / D.h) * .98; };
  const zNear = () => stage().width / (9 * Math.sqrt(3) * S);
  function applyCam() {
    const r = stage();
    const w = r.width / cam.z, h = r.height / cam.z;
    cam.x = Math.min(D.w - w / 2, Math.max(w / 2, cam.x));
    cam.y = Math.min(D.h - h / 2, Math.max(h / 2, cam.y));
    map.setAttribute("viewBox", `${cam.x - w / 2} ${cam.y - h / 2} ${w} ${h}`);
    vp.setAttribute("x", cam.x - w / 2); vp.setAttribute("y", cam.y - h / 2);
    vp.setAttribute("width", w); vp.setAttribute("height", h);
  }
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function camTo(z, x, y, ms = 520) {
    const z0 = cam.z, x0 = cam.x, y0 = cam.y, t0 = performance.now();
    if (ms <= 0 || calm()) { cam.z = z; cam.x = x; cam.y = y; return applyCam(); }
    (function step(t) {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      cam.z = z0 + (z - z0) * e; cam.x = x0 + (x - x0) * e; cam.y = y0 + (y - y0) * e;
      applyCam();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  let drag = null;
  $("#stage").addEventListener("pointerdown", (e) => {
    if (e.target.closest("button") || e.target.closest(".coach") || e.target.closest("#mini")) return;
    drag = { x: e.clientX, y: e.clientY, moved: 0, i: e.target.dataset && e.target.dataset.i };
    $("#stage").setPointerCapture(e.pointerId);
  });
  $("#stage").addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    drag.x = e.clientX; drag.y = e.clientY;
    applyCam();
  });
  $("#stage").addEventListener("pointerup", () => {
    if (drag && drag.moved < 8 && drag.i !== undefined) pick(+drag.i);
    drag = null;
  });
  const clampZ = () => { cam.z = Math.min(zNear() * 2, Math.max(zAll(), cam.z)); };
  $("#zin").onclick = () => { cam.z *= 1.5; clampZ(); applyCam(); };
  $("#zout").onclick = () => { cam.z /= 1.5; clampZ(); applyCam(); };
  addEventListener("resize", applyCam);

  // ---------- клетки ----------
  function paint(i, club, byMe) {
    const prev = owner[i];
    if (prev === club) return;
    if (prev >= 0) byClub[prev]--;
    owner[i] = club;
    byClub[club]++;
    if (byMe) { mineCell[i] = 1; ST.taken++; } else if (club !== ST.me) mineCell[i] = 0;
    marks[i].setAttribute("r", mineCell[i] ? S * .17 : 0);
    nodes[i].style.fill = CLUBS[club].game;
    nodes[i].classList.add("own");
    miniNodes[i].setAttribute("fill", CLUBS[club].game);
    nodes[i].classList.remove("hit");
    void nodes[i].getBBox;
    nodes[i].classList.add("hit");
    if (prev >= 0 && prev !== club) cutOff(prev);
  }
  function neutral(i) {
    if (owner[i] >= 0) byClub[owner[i]]--;
    owner[i] = -1; mineCell[i] = 0;
    marks[i].setAttribute("r", 0);
    nodes[i].style.fill = "";
    nodes[i].classList.remove("own");
    miniNodes[i].setAttribute("fill", "var(--land)");
  }
  function cutOff(club) {
    const base = CLUBS[club].base;
    if (owner[base] !== club) return 0;
    const seen = new Set([base]), st = [base];
    while (st.length) for (const j of ADJ[st.pop()]) if (owner[j] === club && !seen.has(j)) { seen.add(j); st.push(j); }
    let lost = 0;
    for (let i = 0; i < N; i++) if (owner[i] === club && !seen.has(i)) { neutral(i); lost++; }
    if (lost >= 2) toast(`Отрезано ${lost} ${plural(lost, "клетка", "клетки", "клеток")} у «${CLUBS[club].name}»`);
    return lost;
  }

  // ---------- цена и цели ----------
  function cost(i) {
    const o = owner[i];
    if (o < 0) return 1;
    if (baseOf[i] >= 0) return 99;
    const near = ADJ[i].some((j) => baseOf[j] === o);
    return 2 + (near ? 1 + level[o] : 0);
  }
  const reach = (club) => {
    const set = new Set();
    for (let i = 0; i < N; i++) if (owner[i] === club) for (const j of ADJ[i]) if (owner[j] !== club) set.add(j);
    return set;
  };
  function canOrder(i) {
    if (ST.me < 0 || owner[i] === ST.me || baseOf[i] >= 0) return false;
    return ST.landing.has(i) || ADJ[i].some((j) => owner[j] === ST.me);
  }

  // ---------- приказы ----------
  function drawTargets() {
    gCan.textContent = "";
    if (ST.me < 0 || ST.phase !== "plan") return;
    for (let i = 0; i < N; i++) {
      if (!canOrder(i) || ST.orders.has(i)) continue;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", hexPath(CELLS[i].x, CELLS[i].y));
      p.setAttribute("class", ST.landing.has(i) ? "landing" : "can");
      gCan.appendChild(p);
      if (owner[i] >= 0) {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", CELLS[i].x); t.setAttribute("y", CELLS[i].y);
        t.setAttribute("class", "cost");
        t.textContent = cost(i);
        gCan.appendChild(t);
      }
    }
    if (ST.sel >= 0) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", hexPath(CELLS[ST.sel].x, CELLS[ST.sel].y));
      p.setAttribute("class", "sel");
      gCan.appendChild(p);
    }
  }
  function drawOrders() {
    gOrd.textContent = "";
    for (const [i, n] of ST.orders) {
      const from = nearestOwn(i);
      if (from < 0) continue;
      const tint = document.createElementNS(NS, "path");
      tint.setAttribute("d", hexPath(CELLS[i].x, CELLS[i].y));
      tint.setAttribute("fill", CLUBS[ST.me].game);
      tint.setAttribute("opacity", ".45");
      tint.setAttribute("stroke", CLUBS[ST.me].game);
      tint.setAttribute("stroke-width", "3");
      gOrd.appendChild(tint);
      const a = CELLS[from], b = CELLS[i];
      const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
      const sx = a.x + dx / L * S * .5, sy = a.y + dy / L * S * .5;
      const ex = b.x - dx / L * S * .62, ey = b.y - dy / L * S * .62;
      const line = document.createElementNS(NS, "path");
      line.setAttribute("d", `M${sx} ${sy}L${ex} ${ey}`);
      line.setAttribute("class", "ord");
      const ang = Math.atan2(dy, dx);
      const head = document.createElementNS(NS, "path");
      head.setAttribute("d", `M${ex} ${ey}L${ex - 11 * Math.cos(ang - .4)} ${ey - 11 * Math.sin(ang - .4)}L${ex - 11 * Math.cos(ang + .4)} ${ey - 11 * Math.sin(ang + .4)}Z`);
      head.setAttribute("class", "ord-head");
      const bg = document.createElementNS(NS, "circle");
      bg.setAttribute("cx", ex); bg.setAttribute("cy", ey); bg.setAttribute("r", 9);
      bg.setAttribute("class", "ord-bg");
      const tx = document.createElementNS(NS, "text");
      tx.setAttribute("x", ex); tx.setAttribute("y", ey);
      tx.setAttribute("class", "ord-n"); tx.setAttribute("text-anchor", "middle");
      tx.setAttribute("dominant-baseline", "central");
      tx.textContent = n;
      gOrd.append(line, head, bg, tx);
    }
  }
  function nearestOwn(i) {
    let best = -1, bd = 1e9;
    for (const j of ADJ[i]) if (owner[j] === ST.me) return j;
    for (let k = 0; k < N; k++) {
      if (owner[k] !== ST.me) continue;
      const d = (CELLS[k].x - CELLS[i].x) ** 2 + (CELLS[k].y - CELLS[i].y) ** 2;
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  }

  function pick(i) {
    if (ST.me < 0 || ST.phase !== "plan") return;
    if (ST.orders.has(i)) {                       // отменить приказ
      ST.res += ST.orders.get(i);
      ST.orders.delete(i);
      ST.sel = -1;
      return refresh();
    }
    if (!canOrder(i)) {
      hint(owner[i] === ST.me ? "Это уже твоя клетка." : "Направлять можно только на клетки рядом со своими — или в десант.");
      return;
    }
    ST.sel = i;
    ST.push = cost(i);
    showTarget();
  }
  function showTarget() {
    const i = ST.sel, c = cost(i);
    const who = owner[i] < 0 ? "ничья земля" : `земля «${CLUBS[owner[i]].name}»`;
    $("#tgt-info").innerHTML = `${ST.landing.has(i) ? "Десант · " : ""}${who}
      <small>цена ${c} · у тебя ${ST.res} резерва. Сильнее — выигрываешь, если туда идёт кто-то ещё</small>`;
    $("#push-n").textContent = ST.push;
    $("#push-less").disabled = ST.push <= c;
    $("#push-more").disabled = ST.push >= ST.res;
    $("#send").disabled = c > ST.res;
    $("#bar-plan").hidden = true;
    $("#bar-target").hidden = false;
    refresh(true);
  }
  $("#push-less").onclick = () => { ST.push = Math.max(cost(ST.sel), ST.push - 1); showTarget(); };
  $("#push-more").onclick = () => { ST.push = Math.min(ST.res, ST.push + 1); showTarget(); };
  $("#send").onclick = () => {
    const i = ST.sel;
    if (i < 0) return;
    const n = Math.max(cost(i), Math.min(ST.res, ST.push));
    if (n > ST.res) return;
    ST.res -= n;
    ST.orders.set(i, n);
    ST.sel = -1;
    closeTarget();
    if (ST.step === 1) coachStep(2);
    refresh();
  };
  $("#cancel").onclick = () => { ST.sel = -1; closeTarget(); refresh(); };
  function closeTarget() {
    $("#bar-target").hidden = true;
    $("#bar-plan").hidden = false;
  }

  // ---------- боты: штабы остальных клубов ----------
  function aiOrders() {
    const all = [];
    CLUBS.forEach((c, k) => {
      if (k === ST.me) return;
      let budget = income(k);
      const targets = [...reach(k)].filter((i) => baseOf[i] < 0
        && !(ST.week === 1 && ADJ[i].some((j) => baseOf[j] === ST.me) && Math.random() < .6));
      targets.sort((a, b) => (owner[a] < 0 ? 0 : 1) - (owner[b] < 0 ? 0 : 1) + Math.random() - .5);
      for (const i of targets) {
        const c = cost(i);
        if (c > budget) continue;
        budget -= c;
        all.push({ cell: i, club: k, push: c });
        if (budget <= 0) break;
      }
    });
    return all;
  }
  const income = (k) => 3 + Math.floor(byClub[k] / 3) + level[k];

  // ---------- игровой вечер ----------
  const FIX = () => (D.fixtures[CLUBS[ST.me].id] || []);
  function night() {
    if (ST.phase !== "plan") return;
    ST.phase = "night";
    $("#go").disabled = true;
    const f = FIX()[(ST.week - 1) % Math.max(1, FIX().length)];
    const a = f ? CLUBS.findIndex((c) => c.id === f.h) : -1;
    const b = f ? CLUBS.findIndex((c) => c.id === f.a) : -1;
    // сценарий демо: дома выиграли, в гостях выиграли, третью проиграли — видны все три эффекта
    const script = [true, true, false][(ST.week - 1) % 3];
    const home = a === ST.me;
    const win = script;
    const score = home ? (win ? "3:2" : "1:4") : (win ? "1:4" : "4:1");
    ST.lastScore = f ? `${CLUBS[a].name} ${score} ${CLUBS[b].name}` : "";
    const other = home ? b : a;
    ticker(`<b>${ST.lastScore}</b> — ${win ? (home ? "победа дома" : "победа в гостях") : "поражение"}`);
    const power = win ? 1 : .5;
    const ai = aiOrders();
    const mine = [...ST.orders].map(([cell, push]) => ({ cell, club: ST.me, push: Math.round(push * power), my: true }));
    resolve(mine.concat(ai), () => {
      // эффекты реального матча
      ST.landing = new Set();
      if (win && !home && other >= 0) {
        ST.landing = new Set(ADJ[CLUBS[other].base].filter((j) => owner[j] !== ST.me && baseOf[j] < 0));
        const t = CELLS[CLUBS[other].base];
        setTimeout(() => camTo(zNear(), t.x, t.y, 700), 400);
      }
      if (win && home) level[ST.me] = Math.min(3, level[ST.me] + 1);
      weekResult(win, home, other);
    });
  }

  function resolve(list, done) {
    // на одну клетку могут давить несколько штабов. Берёт тот, кто сильнее.
    // Равная сила — клетка остаётся за хозяином: случайности в игре нет
    const by = new Map();
    for (const o of list) {
      if (!by.has(o.cell)) by.set(o.cell, []);
      by.get(o.cell).push(o);
    }
    const steps = [];
    ST.report = [];
    for (const [cell, os] of by) {
      os.sort((a, b) => b.push - a.push);
      const top = os[0], second = os[1];
      const tie = second && second.push === top.push;
      const win = !tie && top.push >= cost(cell) ? top : null;
      if (win) steps.push(win);
      const my = os.find((o) => o.my);
      const what = owner[cell] < 0 ? "ничья земля" : `земля «${CLUBS[owner[cell]].name}»`;
      if (my) {
        if (win && win.my) ST.report.push({ cell, what, ok: true, push: my.push });
        else if (tie && os.some((o) => o.my && o.push === top.push)) ST.report.push({ cell, what, ok: false, why: "туда шёл ещё один штаб с такой же силой — клетка осталась за хозяином" });
        else if (win) ST.report.push({ cell, what, ok: false, why: `перебил «${CLUBS[win.club].name}»: ${win.push} против ${my.push}` });
        else ST.report.push({ cell, what, ok: false, why: `силы не хватило: ${my.push} при цене ${cost(cell)}` });
      }
    }
    let k = 0;
    const tick = () => {
      if (k >= steps.length) { ST.orders.clear(); gOrd.textContent = ""; return done(); }
      const o = steps[k++];
      paint(o.cell, o.club, !!o.my);
      setTimeout(tick, calm() ? 0 : 55);
    };
    setTimeout(tick, 700);
  }

  function weekResult(win, home, other) {
    const inc = income(ST.me) + (win ? 2 : 0);
    ST.res += inc;
    refresh();
    const rep = (ST.report || []).map((r) => {
      return `<tr><td>${r.ok ? "Взято" : "Не прошло"} · ${r.what}</td><td class="n">${r.ok ? "+1" : "—"}</td></tr>`
        + (r.ok ? "" : `<tr><td colspan="2" class="why">${r.why}</td></tr>`);
    }).join("");
    const lines = (rep || "") + [
      `<tr><td>Клеток у клуба</td><td class="n">${byClub[ST.me]}</td></tr>`,
      `<tr><td>Взято тобой за круг</td><td class="n">${ST.taken}</td></tr>`,
      `<tr><td>Резерв на неделю</td><td class="n">+${inc}</td></tr>`,
    ].join("");
    const extra = win
      ? (home ? `<p><b>Победа дома.</b> Кольцо вокруг своего города укреплено: чужим дороже его грызть.</p>`
              : `<p><b>Победа в гостях.</b> Открыт десант у города «${CLUBS[other].name}» — туда можно направить резерв, не дотягиваясь фронтом.</p>`)
      : `<p><b>Поражение.</b> Приказы исполнились наполовину: соперники продвинулись сильнее.</p>`;
    ST.week++;
    const last = ST.week > WEEKS;
    show(`<h1>Неделя ${ST.week - 1}</h1><p class="muted">${ST.lastScore}</p>${extra}
      <table>${lines}</table>
      ${last ? standingsHtml() : ""}
      <div class="acts"><button class="btn" id="next">${last ? "Ещё круг" : "К карте"}</button>
      ${last ? "" : '<button class="btn ghost" id="why3">Правила</button>'}</div>`);
    $("#next").onclick = last ? reset : () => { hide(); ST.phase = "plan"; $("#go").disabled = false; $("#weekn").textContent = ST.week; refresh(); };
    if (!last) $("#why3").onclick = why;
    if (last) ST.over = true;
  }

  function standingsHtml() {
    const order = CLUBS.map((c, i) => [i, byClub[i]]).sort((x, y) => y[1] - x[1]).slice(0, 6);
    return `<h2>Кто держит лигу</h2><table>${order.map(([i, n], k) => `<tr class="${i === ST.me ? "me" : ""}">
      <td class="em"><img src="${CLUBS[i].logo}" alt=""></td><td>${k + 1}. ${CLUBS[i].name}</td><td class="n">${n}</td></tr>`).join("")}</table>
      <p class="muted">В январе карта обнуляется: все снова начинают с одного города.</p>`;
  }

  $("#go").onclick = night;

  // ---------- интерфейс ----------
  function refresh(light) {
    $("#res-n").textContent = ST.res;
    $("#res-in").textContent = ST.orders.size ? `${ST.orders.size} ${plural(ST.orders.size, "приказ", "приказа", "приказов")}` : `+${income(ST.me < 0 ? 0 : ST.me)} в неделю`;
    if (ST.me >= 0) {
      $("#my-name").innerHTML = `<i class="chip" style="background:${CLUBS[ST.me].game}"></i>${CLUBS[ST.me].name}<small>у клуба ${byClub[ST.me]} ${plural(byClub[ST.me], "клетка", "клетки", "клеток")} · твоих ${ST.taken}</small>`;
      if (ST.step > 2 && ST.phase === "plan" && !ST.over) {
        hint(ST.orders.size ? "Готов — жми «Игровой вечер»: приказы исполнятся по результату матча." : "Выбери клетку на фронте и направь туда резерв.");
      }
    }
    if (!light) { drawTargets(); drawOrders(); }
  }
  const hint = (t) => { $("#hint").innerHTML = t; };
  const ticker = (t) => { $("#ticker").innerHTML = t; };
  let toastT = null;
  function toast(t) {
    const el = $("#toast");
    el.hidden = false; el.textContent = t;
    requestAnimationFrame(() => el.classList.add("on"));
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.classList.remove("on"); setTimeout(() => { el.hidden = true; }, 220); }, 2400);
  }
  const show = (html) => { $("#card").innerHTML = html; $("#veil").hidden = false; };
  const hide = () => { $("#veil").hidden = true; };

  const COACH = ["",
    "Пунктир — куда можно направить резерв: только рядом со своими клетками. Нажми на любую.",
    "Приказ поставлен. Если на эту клетку пойдёт ещё кто-то, возьмёт тот, кто сильнее: кнопкой + можно добавить резерва. Дальше — «Игровой вечер».",
  ];
  function coachStep(n) {
    ST.step = n;
    const c = $("#coach");
    if (!COACH[n]) { c.hidden = true; return; }
    c.hidden = false;
    $("#coach-t").textContent = COACH[n];
    $("#coach-b").hidden = n === 1;
    $("#coach-b").textContent = "Понял";
    $("#coach-b").onclick = () => { c.hidden = true; ST.step = 3; refresh(); };
  }

  function why() {
    show(`<h1>Правила</h1>
      <p><b>Поле.</b> Вся Россия — 359 клеток. Каждый клуб начинает с одной: своего города. Город забрать нельзя, он якорь.</p>
      <p><b>Резерв</b> копится сам: база плюс по единице за каждые три клетки. Тапать его не надо — он приходит за территорию и за победы.</p>
      <p><b>Приказ.</b> До игрового вечера ты направляешь резерв на клетки, соседние с твоими. Пустая стоит 1, чужая 2, у чужого города дороже.</p>
      <p><b>Игровой вечер.</b> Приказы исполняются по результату настоящего матча: победа — на полную, поражение — наполовину. На одну клетку могут давить двое: берёт тот, кто сильнее.</p>
      <p><b>Победа дома</b> укрепляет кольцо вокруг своего города. <b>Победа в гостях</b> открывает десант: можно бить у города соперника, не дотягиваясь фронтом.</p>
      <p><b>Отрезание.</b> Чужая область, потерявшая связь со своим городом, становится ничьей. Это сильнее лобовой атаки.</p>
      <p class="muted">Денег, призов и случайности в игре нет. Круг заканчивается — карта обнуляется, все снова с одного города.</p>
      <div class="acts"><button class="btn" id="ok">К карте</button></div>`);
    $("#ok").onclick = hide;
  }
  $("#why").onclick = why;
  $("#mini").onclick = () => {
    show(`<h1>Кто держит лигу</h1><p class="muted">Клеток на карте, неделя ${ST.week}.</p>${standingsHtml()}
      <div class="acts"><button class="btn" id="cl">К карте</button></div>`);
    $("#cl").onclick = hide;
  };

  // ---------- старт ----------
  function pickTeam() {
    const list = CLUBS.map((c, i) => `<button class="tm" data-k="${i}"><img src="${c.logo}" alt=""><span>${c.name}</span></button>`).join("");
    show(`<h1>Карта лиги</h1>
      <p>Вся Россия — поле на 359 клеток. 26 клубов, у каждого один город на старте. Ты — штаб своего клуба: раз в неделю решаешь, куда направить резерв, а исполняются приказы по результатам настоящих матчей.</p>
      <p class="muted">Прототип: остальные клубы ведут боты, неделя проходит по кнопке, три недели — круг.</p>
      <h2>За кого играешь</h2><div class="teams">${list}</div>`);
    $("#card").querySelectorAll(".tm").forEach((b) => { b.onclick = () => start(+b.dataset.k); });
  }
  function start(k) {
    ST.me = k;
    hide();
    $("#my-crest").innerHTML = `<img src="${CLUBS[k].logo}" alt="">`;
    const cell = CELLS[CLUBS[k].base];
    cam.x = cell.x; cam.y = cell.y; cam.z = zNear();
    applyCam();
    ST.res = 10;
    ticker(`Ты за «${CLUBS[k].name}». Город — ${CLUBS[k].city}. Резерв копится сам.`);
    hint("Нажми клетку с пунктиром — туда пойдёт резерв.");
    coachStep(1);
    refresh();
  }
  function reset() {
    hide();
    for (let i = 0; i < N; i++) if (owner[i] >= 0) neutral(i);
    CLUBS.forEach((c, i) => { paint(c.base, i, false); level[i] = 0; });
    ST.res = 10; ST.week = 1; ST.taken = 0; ST.over = false; ST.phase = "plan";
    ST.orders.clear(); ST.landing = new Set();
    $("#go").disabled = false;
    $("#weekn").textContent = 1;
    refresh();
  }

  CLUBS.forEach((c, i) => paint(c.base, i, false));
  cam.z = zAll();
  applyCam();
  refresh();
  pickTeam();
})();
</script>
