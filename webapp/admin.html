<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>РХЛ — пульт</title>
  <link rel="icon" href="brand/icon.svg" type="image/svg+xml">
  <!-- пульт открывается из бота, без Telegram ему нечем войти: грузим сразу, тема берётся из него -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Тема до первой отрисовки (DESIGN.md → «Две темы»): за Telegram, вне его — за системой
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var dark = tg && tg.initData ? tg.colorScheme === "dark" : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
    // База API на VPS (ADR-019, ADR-021). Подставляет Pages-задание из переменной LIVE_API
    window.LIVE_API = "";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700&family=Unbounded:wght@800&display=swap">
  <link rel="stylesheet" href="admin.css">
  <script defer src="admin.js"></script>
</head>
<body>
  <header class="band">
    <div class="head">
      <h1>Пульт</h1>
      <button type="button" class="btn-round" id="refresh" aria-label="Обновить">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>
      </button>
    </div>
    <div class="lede" id="when">Загружаю…</div>
  </header>
  <main id="main" aria-live="polite"></main>
</body>
</html>
