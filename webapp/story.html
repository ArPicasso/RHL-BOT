<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=540">
  <meta name="robots" content="noindex">
  <title>Карточка для истории</title>
  <!-- Карточка клуба для Telegram Stories (ADR-004). Не экран приложения: tools/render_stories.js
       снимает её в webapp/stories/<id>.jpg, 540×960 при плотности 2 → 1080×1920 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700;800&family=Unbounded:wght@800&display=block">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #dceeff; color: #000; }
    body { position: relative; font-family: "Onest", system-ui, sans-serif; }

    /* верх и низ кадра закрывает интерфейс Stories — главное держим в середине */
    .strip {
      position: absolute; z-index: 1; left: 0; right: 0; top: 96px; height: 40px;
      background: #000; color: #fff; font: 700 15px/40px "Onest", sans-serif; letter-spacing: .06em;
      text-transform: uppercase; white-space: nowrap; overflow: hidden; transform: rotate(-3deg); transform-origin: 0 0; width: 120%;
    }
    .strip span::after { content: "✦"; color: #ffd731; margin: 0 18px; }

    /* сцена между полосой и плашкой внизу; всё, что не влезло, уменьшается в скрипте */
    .stage {
      position: absolute; z-index: 0; left: 44px; right: 44px; top: 170px; bottom: 300px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .em-wrap { position: relative; flex: none; }
    .ribbon { position: absolute; left: -300px; top: -230px; width: 900px; z-index: -1; }
    .ribbon path { fill: none; stroke-linecap: round; }
    .em {
      position: relative; z-index: 1; width: 220px; height: 220px; border-radius: 50%;
      border: 2px solid #000; background: #fff; display: grid; place-items: center; overflow: hidden; transform: rotate(-6deg);
    }
    .em img { width: 78%; height: 78%; object-fit: contain; }
    .em.ab { background: #5c4ade; color: #fff; font: 800 64px/1 "Onest", sans-serif; }

    .star { position: absolute; z-index: 2; right: -70px; top: -30px; width: 92px; transform: rotate(14deg); }
    .puck { position: absolute; z-index: 2; left: -90px; top: 150px; width: 96px; transform: rotate(-12deg); }

    .fan {
      flex: none; margin-top: 30px; padding: 10px 22px; border: 2px solid #000; border-radius: 9999px;
      background: #55db9c; font: 800 20px/1 "Onest", sans-serif; letter-spacing: .06em; text-transform: uppercase; transform: rotate(-3deg);
    }
    h1 {
      margin: 18px 0 0; width: 100%; text-align: center; font: 800 var(--fs, 64px)/0.92 "Unbounded", sans-serif; letter-spacing: -0.01em;
    }
    .meta { margin-top: 18px; text-align: center; font: 700 18px/1.3 "Onest", sans-serif; letter-spacing: .05em; text-transform: uppercase; }

    .cta {
      position: absolute; left: 44px; right: 44px; bottom: 170px; padding: 20px 24px;
      border: 2px solid #000; border-radius: 28px; background: #fff;
      display: flex; align-items: center; gap: 16px;
    }
    .cta b { display: block; font: 800 22px/1.15 "Onest", sans-serif; }
    .cta small { display: block; margin-top: 4px; font: 700 15px/1.3 "Onest", sans-serif; color: #555; }
    .cta i { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #e9ccff; border: 2px solid #000; display: grid; place-items: center; font-style: normal; }
  </style>
</head>
<body>
  <div class="strip" id="strip"></div>
  <div class="stage">
    <div class="em-wrap">
    <svg class="ribbon" viewBox="0 0 400 260" aria-hidden="true">
      <path d="M-20 210 C 70 30, 170 280, 250 130 S 370 20, 430 80" stroke="#000" stroke-width="40"/>
      <path d="M-20 210 C 70 30, 170 280, 250 130 S 370 20, 430 80" stroke="#4da2ff" stroke-width="35"/>
    </svg>
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true"><path d="m50 6 12.5 27 29.5 3.5-22 20 6 29.5L50 71 23.5 86l6-29.5-22-20L37 33z" fill="#ffd731" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>
    <svg class="puck" viewBox="0 0 120 80" aria-hidden="true"><path d="M8 30 v18 a52 22 0 0 0 104 0 v-18 z" fill="#000" stroke="#fff" stroke-width="8" stroke-linejoin="round" paint-order="stroke"/><ellipse cx="60" cy="30" rx="52" ry="22" fill="#000" stroke="#fff" stroke-width="4"/></svg>
    <div class="em" id="em"></div>
    </div>
    <div class="fan">Болею за</div>
    <h1 id="name"></h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="cta">
    <div><b>Матчи, таблица и счёт РХЛ</b><small>Мини-приложение в Telegram</small></div>
    <i><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></i>
  </div>
  <script>
    // Данные из того же league.json, что и у мини-аппа. Текст вставляем через textContent
    (async function () {
      const id = new URLSearchParams(location.search).get("team");
      const d = await (await fetch("data/league.json")).json();
      const t = d.teams.find((x) => x.id === id);
      if (!t) { document.body.dataset.ready = "missing"; return; }
      const em = document.getElementById("em");
      if (t.logo) {
        const img = new Image();
        img.src = t.logo;
        img.alt = "";
        em.appendChild(img);
        await img.decode().catch(() => {});
      } else {
        em.classList.add("ab");
        em.textContent = t.abbr;
      }
      const name = document.getElementById("name");
      name.textContent = t.name;
      // кегль по самому длинному слову: 452px — ширина сцены, 0.9em — средняя ширина буквы Unbounded
      const longest = Math.max(...t.name.split(/\s+/).flatMap((w) => w.split(/(?<=-)/)).map((x) => x.length));
      name.style.setProperty("--fs", Math.min(64, Math.floor(452 / (longest * 0.9))) + "px");
      document.getElementById("meta").textContent = `${t.city} · ${t.conf === "east" ? "Восток" : "Запад"}`;
      const s = document.getElementById("strip");
      for (const x of ["РХЛ", `сезон ${d.season}`, "Первенство России U21", "РХЛ", `сезон ${d.season}`]) {
        const el = document.createElement("span");
        el.textContent = x;
        s.appendChild(el);
      }
      await document.fonts.ready;
      // длинное название в несколько строк: уменьшаем, пока сцена не вместит всё целиком
      const box = (el) => el.getBoundingClientRect();
      const stage = document.querySelector(".stage");
      const meta = document.getElementById("meta");
      const fits = () => box(meta).bottom <= box(stage).bottom && box(em).top >= box(stage).top - 20 && name.scrollWidth <= name.clientWidth;
      let fs = parseInt(name.style.getPropertyValue("--fs"), 10);
      while (fs > 28 && !fits()) {
        fs -= 2;
        name.style.setProperty("--fs", fs + "px");
      }
      document.body.dataset.ready = "1";
    })();
  </script>
</body>
</html>
